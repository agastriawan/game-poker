name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PokerBarudak.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokerBarudak-Debug-APK
          path: android/app/build/outputs/apk/debug/PokerBarudak.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Poker Barudak Android APK (Terbaru)"
          body: |
            ## 📱 Unduh Poker Barudak Android APK
            File APK siap di-install di smartphone Android:
            - **Nama File**: `PokerBarudak.apk`
            - **Tipe**: Debug APK (Capacitor Native Android)
            - **Fitur**: Landscape Otomatis, Layar Penuh, WebRTC Voice, Audio Responsif.

            Klik pada link **PokerBarudak.apk** di bawah untuk langsung mengunduh ke HP Anda.
          files: android/app/build/outputs/apk/debug/PokerBarudak.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
